<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imágenes MMSCI - 1º CFGB Informática de Oficina</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f7f7;
        }
        h1 {
            text-align: center;
        }
        .galeria {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 700px;
            margin: 0 auto;
        }
        figure {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: fit-content;
            margin: 0 auto;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
        figcaption {
            margin-top: 10px;
            text-align: center;
            font-size: 1.1rem;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Galería de imágenes MMSCI - 1º CFGB Informática de Oficina</h1>

    <div class="galeria">
        <figure>
            <img src="img/imagen1.png" alt="Descripción de la imagen 1" style="width: 200px; height: 200px; object-fit: cover;">
            <figcaption>Imagen 1</figcaption>
        </figure>
